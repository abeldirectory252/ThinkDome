<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ThinkDome Secure LLM Sandbox Orchestrator and Professional IDE Dashboard" />
  <title>ThinkDome — Secure LLM Sandbox & IDE</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- RequireJS for loading Monaco Editor from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
</head>

<body>

  <!-- ============ LOGIN VIEW ============ -->
  <div id="loginView" class="login-wrap">
    <div class="login-theme-toggle">
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </button>
    </div>
    <div class="login-card">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
          <path d="m21 16-9 5-9-5V8l9-5 9 5v8Z" />
          <path d="m3.3 7 8.7 5 8.7-5" />
          <path d="M12 22V12" />
        </svg>
        <span>Think<span class="dome">Dome</span></span>
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Secure autonomous LLM sandbox orchestrator</p>

      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="setAuthTab('login')">LOGIN</button>
        <button class="tab" id="tabRegister" onclick="setAuthTab('register')">CREATE ACCOUNT</button>
      </div>

      <div id="loginAlert" class="alert alert-error" style="display:none;margin-bottom:14px;"></div>

      <form autocomplete="off" onsubmit="enterApp(event)">
        <!-- Sliding Registration Drawer -->
        <div class="auth-registration-drawer" id="authRegistrationDrawer">
          <div class="field" id="emailField">
            <label for="email">Email address <span style="color:var(--accent); font-weight:bold;">*</span></label>
            <div class="input-shell"><input id="email" type="email" autocomplete="email" placeholder="you@example.com" /></div>
          </div>
          <div class="auth-form-row">
            <div class="field" id="firstNameField">
              <label for="firstName">First name <span style="color:var(--accent); font-weight:bold;">*</span></label>
              <div class="input-shell"><input id="firstName" type="text" autocomplete="given-name" placeholder="First name" /></div>
            </div>
            <div class="field" id="lastNameField">
              <label for="lastName">Last name <span style="color:var(--accent); font-weight:bold;">*</span></label>
              <div class="input-shell"><input id="lastName" type="text" autocomplete="family-name" placeholder="Last name" /></div>
            </div>
          </div>

          <!-- Accordion Toggle Button for sliding open / covering up extra details -->
          <button type="button" class="auth-accordion-btn" id="btnToggleExtraProfile" onclick="toggleExtraProfile()" aria-expanded="false">
            <span id="extraProfileToggleLabel">✦ Additional Profile Details (Optional)</span>
            <svg id="extraProfileToggleChevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>

          <!-- Sliding Accordion Container for Extra Profile Details -->
          <div class="auth-extra-profile" id="authExtraProfile">
            <div class="auth-form-row">
              <div class="field" id="phoneField">
                <label for="phone">Phone</label>
                <div class="input-shell"><input id="phone" type="tel" autocomplete="tel" placeholder="+1 (555) 012-3456" /></div>
              </div>
              <div class="field" id="orgField">
                <label for="organization">Organization</label>
                <div class="input-shell"><input id="organization" type="text" placeholder="Acme Corp" /></div>
              </div>
            </div>
            <div class="auth-form-row">
              <div class="field" id="deptField">
                <label for="department">Department</label>
                <div class="input-shell"><input id="department" type="text" placeholder="Engineering" /></div>
              </div>
              <div class="field" id="designationField">
                <label for="designation">Designation</label>
                <div class="input-shell"><input id="designation" type="text" placeholder="Security Engineer" /></div>
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="username">Username</label>
          <div class="input-shell">
            <input id="username" type="text" placeholder="Enter username..." autocomplete="off" />
            <span class="field-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-shell">
            <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" readonly
              onfocus="this.removeAttribute('readonly')" />
            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Toggle Password Visibility" aria-label="Toggle Password Visibility">
              <svg id="pwdEyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <p id="passwordHint" class="login-note" style="display:none">Use at least 12 characters. New accounts receive the least-privileged standard agent access; an administrator can grant more permissions later.</p>
        <button class="submit-btn" type="submit">
          Access Sandbox Workspace
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </form>
      <p class="login-note">Sign in with your sandbox account, or create an account for an agent.</p>
    </div>
  </div>



  <script type="module">
    import * as API from './assets/js/api.js?v=10';
    window.API = API;
  </script>
  <script src="assets/js/state.js?v=9"></script>
  <script src="assets/js/auth.js?v=9"></script>
  <script src="assets/js/dashboard.js?v=9"></script>
  <script src="assets/js/sandboxes.js?v=9"></script>
  <script src="assets/js/editor.js?v=9"></script>
  <script src="assets/js/terminal.js?v=9"></script>
  <script src="assets/js/app.js?v=9"></script>
  <script>
    window.addEventListener('pageshow', function () {
      const password = document.getElementById('password');
      if (password) password.value = '';
    });
  </script>
</body>

</html>
