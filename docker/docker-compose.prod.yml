# ThinkDome Production Stack
# Run: docker compose -f docker/docker-compose.prod.yml up -d
#
# Services:
#   - thinkdome-api:             Stateless FastAPI (communicates via isolated executor control plane)
#   - thinkdome-worker:          RabbitMQ consumer (communicates via isolated executor control plane)
#   - thinkdome-docker-executor: Dedicated Docker Executor control-plane service (only service with Docker certs)
#   - postgres:                  State store (users, sandboxes, audit logs)
#   - rabbitmq:                  Task queue (distributed execution orchestration)
#   - redis:                     Rate limiting, session cache
#   - executor Docker daemon:    Externally managed rootless/hardened Docker endpoint
#   - otel-collector:            OpenTelemetry metrics/traces receiver

version: "3.9"

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set with non-default production credentials}
  RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL must be set with non-default production credentials}
  REDIS_URL: redis://redis:6379/0
  EXECUTOR_BACKEND: docker
  EXECUTOR_IMAGE: ${EXECUTOR_IMAGE:?EXECUTOR_IMAGE must be an immutable image reference using @sha256}
  POOL_ENABLED: "true"
  POOL_MIN_WARM: "3"
  POOL_MAX_SIZE: "50"
  FILE_STORAGE_DIR: /data/storage
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: thinkdome

services:
  # ── Data Stores ────────────────────────────────────────────────────────────

  postgres:
    image: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    restart: unless-stopped
    environment:
      POSTGRES_DB: thinkdome
      POSTGRES_USER: thinkdome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkdome"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    restart: unless-stopped
    volumes:
      - rmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Dedicated Docker Executor Service (DIND-002 Boundary) ───────────────────

  thinkdome-docker-executor:
    build:
      context: ..
      dockerfile: docker/thinkdome/Dockerfile
    command: ["python", "-m", "thinkdome.services.docker_executor"]
    restart: unless-stopped
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    environment:
      <<: *common-env
      DOCKER_HOST: ${EXECUTOR_DOCKER_HOST:?EXECUTOR_DOCKER_HOST must point to an externally managed rootless/hardened Docker daemon}
      DOCKER_TLS_VERIFY: "true"
      DOCKER_CERT_PATH: /certs/client
      EXECUTOR_CONTROL_AUTH_TOKEN: ${EXECUTOR_CONTROL_AUTH_TOKEN:?EXECUTOR_CONTROL_AUTH_TOKEN must be set to a random value of at least 32 characters}
      EXECUTOR_CONTROL_PORT: "8200"
      OTEL_SERVICE_NAME: thinkdome-docker-executor
    volumes:
      - ${EXECUTOR_DOCKER_CERT_DIR:?EXECUTOR_DOCKER_CERT_DIR must contain the executor Docker client certificates}:/certs:ro
      - workspace:/data/storage
    user: "1000:1000"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Application ────────────────────────────────────────────────────────────

  thinkdome-api:
    build:
      context: ..
      dockerfile: docker/thinkdome/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      EXECUTOR_CONTROL_URL: http://thinkdome-docker-executor:8200
      EXECUTOR_CONTROL_AUTH_TOKEN: ${EXECUTOR_CONTROL_AUTH_TOKEN:?EXECUTOR_CONTROL_AUTH_TOKEN must be set to a random value of at least 32 characters}
    volumes:
      - workspace:/data/storage
    user: "1000:1000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      thinkdome-docker-executor:
        condition: service_started
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  thinkdome-worker:
    build:
      context: ..
      dockerfile: docker/thinkdome/Dockerfile
    command: ["python", "-m", "thinkdome.services.task_worker"]
    restart: unless-stopped
    environment:
      <<: *common-env
      EXECUTOR_CONTROL_URL: http://thinkdome-docker-executor:8200
      EXECUTOR_CONTROL_AUTH_TOKEN: ${EXECUTOR_CONTROL_AUTH_TOKEN:?EXECUTOR_CONTROL_AUTH_TOKEN must be set to a random value of at least 32 characters}
      OTEL_SERVICE_NAME: thinkdome-worker
    volumes:
      - workspace:/data/storage
    user: "1000:1000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      thinkdome-docker-executor:
        condition: service_started
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  # One instance per execution node. This process owns MicroVM creation and
  # is intentionally separate from the public API. Put it on a private
  # network/VLAN and terminate mTLS at the node listener or an adjacent mesh.
  thinkdome-node-agent:
    build:
      context: ..
      dockerfile: docker/thinkdome/Dockerfile
    command: ["thinkdome", "node-agent"]
    restart: unless-stopped
    environment:
      EXECUTOR_BACKEND: microvm
      DEPLOYMENT_ENV: production
      NODE_ID: ${NODE_ID:?NODE_ID must be set}
      NODE_REGION: ${NODE_REGION:-default}
      NODE_AGENT_HOST: 0.0.0.0
      NODE_AGENT_PORT: 8100
      NODE_AUTH_KEY_HEX: ${NODE_AUTH_KEY_HEX:?NODE_AUTH_KEY_HEX must be set}
      CONTROL_PLANE_INTERNAL_URL: ${CONTROL_PLANE_INTERNAL_URL:?CONTROL_PLANE_INTERNAL_URL must be set}
      NODE_REQUIRE_MTLS: "true"
      NODE_TLS_CERTFILE: /run/thinkdome/tls/node.crt
      NODE_TLS_KEYFILE: /run/thinkdome/tls/node.key
      NODE_TLS_CAFILE: /run/thinkdome/tls/ca.crt
      MICROVM_KERNEL_PATH: /var/lib/thinkdome/vmlinux
      MICROVM_ROOTFS_PATH: /var/lib/thinkdome/rootfs.ext4
      MICROVM_INITRAMFS_PATH: /var/lib/thinkdome/initramfs.cpio.gz
      MICROVM_STATE_DIR: /var/lib/thinkdome/vm-state
    devices:
      - /dev/kvm:/dev/kvm
    cap_drop: ["ALL"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - node-state:/var/lib/thinkdome
      - ${NODE_TLS_DIR:?NODE_TLS_DIR must be set}:/run/thinkdome/tls:ro
    ports:
      - "127.0.0.1:8100:8100"

  # ── Observability ──────────────────────────────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:4935caa35e9a4cb387e35732e8fb22b2b5759af8d12e7043357f03837f6e8df5
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel/config.yaml:ro

volumes:
  pgdata:
  rmqdata:
  redisdata:
  workspace:
  node-state:
