<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>ThinkDome Live Preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet"><style>:root{--bg:#f8fafc;--card-bg:#ffffff;--border:#e2e8f0;--text:#0f172a;--text-muted:#64748b;--accent:#0284c7;--accent-emerald:#059669;}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;position:relative;overflow-x:hidden;}body::before{content:"";position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(2,132,199,0.08) 0%,rgba(99,102,241,0.03) 50%,transparent 70%);top:-100px;left:-100px;z-index:0;}body::after{content:"";position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);bottom:-150px;right:-150px;z-index:0;}.container{position:relative;z-index:1;width:100%;max-width:680px;}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}.brand{display:flex;align-items:center;gap:10px;font-family:Outfit,sans-serif;font-size:20px;font-weight:800;color:var(--accent);}.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:30px;font-size:12px;font-weight:600;color:var(--accent-emerald);}.pulse{width:8px;height:8px;background:var(--accent-emerald);border-radius:50%;box-shadow:0 0 8px rgba(5,150,105,0.4);animation:p 2s infinite;}@keyframes p{0%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(5,150,105,0.4);}70%{transform:scale(1);box-shadow:0 0 0 8px rgba(5,150,105,0);}100%{transform:scale(0.95);box-shadow:0 0 0 0 rgba(5,150,105,0);}}.card{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:36px;box-shadow:0 20px 40px -15px rgba(0,0,0,0.07);}h1{font-family:Outfit,sans-serif;font-size:30px;font-weight:700;margin-bottom:12px;color:#0f172a;}.sub{color:var(--text-muted);font-size:15px;line-height:1.6;margin-bottom:28px;}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}.stat{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:16px;}.lbl{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;}.val{font-family:Outfit,sans-serif;font-size:20px;font-weight:700;color:var(--accent);}.code{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:16px;font-family:"Fira Code",monospace;font-size:13px;color:#38bdf8;}</style></head><body><div class="container"><div class="header"><div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21 16-9 5-9-5V8l9-5 9 5v8Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>ThinkDome Gateway</span></div><div class="badge"><div class="pulse"></div><span>LIVE PREVIEW ONLINE</span></div></div><div class="card"><h1>Autonomous Web Preview</h1><p class="sub">Generated dynamically by LLM Orchestration and isolated inside a secure ephemeral container gateway.</p><div class="grid"><div class="stat"><div class="lbl">Web Engine</div><div class="val">HTTP / Apache</div></div><div class="stat"><div class="lbl">Isolation</div><div class="val" style="color:#059669;">Sandbox High</div></div><div class="stat"><div class="lbl">Auto TTL</div><div class="val" style="color:#7c3aed;">300 Seconds</div></div></div><div class="code">$ status: 200 OK &bull; memory: isolated &bull; proxy: active</div></div></div></body></html>
